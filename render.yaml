databases:
  - name: safestop360-db
    plan: free
    databaseName: safestop360
    user: safestop360_user

services:
  - type: web
    name: safestop360-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn safestop.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: "/api/health/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "safestop360-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-safestop-frontend.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://your-safestop-frontend.vercel.app,https://safestop360-api.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: safestop360-db
          property: connectionString
